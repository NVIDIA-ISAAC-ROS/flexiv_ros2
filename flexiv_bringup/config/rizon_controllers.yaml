controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    rizon_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    streaming_position_controller:
      type: streaming_position_controller/StreamingPositionController

    # Spawned inactive when runtime_cartesian_switching is true, so a joint controller can hand
    # command authority to Cartesian control without restarting the driver. Spawn it active
    # (robot_controller:=cartesian_motion_controller) together with
    # rdk_control_mode:=cartesian_motion_force to run Cartesian control for the whole session.
    cartesian_motion_controller:
      type: cartesian_motion_controller/CartesianMotionController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    gpio_controller:
      type: gpio_controller/GPIOController

    flexiv_robot_states_broadcaster:
      type: flexiv_robot_states_broadcaster/FlexivRobotStatesBroadcaster

rizon_arm_controller:
  ros__parameters:
    joints:
      - $(var robot_sn)_joint1
      - $(var robot_sn)_joint2
      - $(var robot_sn)_joint3
      - $(var robot_sn)_joint4
      - $(var robot_sn)_joint5
      - $(var robot_sn)_joint6
      - $(var robot_sn)_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0

cartesian_motion_controller:
  ros__parameters:
    tcp_name: $(var robot_sn)_tcp

gpio_controller:
  ros__parameters:
    robot_sn: $(var robot_sn)

flexiv_robot_states_broadcaster:
  ros__parameters:
    robot_sn: $(var robot_sn)
